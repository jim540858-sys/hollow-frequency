<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="History" />
  <title>History</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; height: 100dvh; }
    body { background: #000; color: #9a9a9a; font-family: "Courier New", Courier, monospace; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .message { text-align: center; max-width: 88vw; font-size: clamp(15px, 4.5vw, 19px); line-height: 1.6; letter-spacing: 0.4px; opacity: 0; animation: fadeIn 3s ease forwards 0.8s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { display: inline-block; width: 8px; height: 1.15em; background: #555; margin-left: 3px; vertical-align: text-bottom; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 160px; }
  </style>
</head>
<body>
  <div class="message">
    looking for people you've been with<br>
    and scenarios that you were in<span class="cursor"></span>
  </div>
</body>
</html>
